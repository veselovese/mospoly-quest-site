name: build-and-deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/veselovese/mospoly-quest-site:${{ github.ref_name }}
            ghcr.io/veselovese/mospoly-quest-site:${{ github.ref_name }}-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ github.ref_name == 'main' && secrets.SSH_KEY_PRODUCTION || secrets.SSH_KEY_STAGING }}
          KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@"$HOST"
